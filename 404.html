<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progora – lanseras snart</title>
<meta name="description" content="Progora är en ny marknadsplats där du hittar och bokar proffs till ditt event. Lanseras snart.">
<meta name="color-scheme" content="light dark">
<!-- Holding page for progora.se: no scripts, no cookies, no tracking and
     no external requests (system fonts). -->
<style>
  :root {
    --bg: #fdf9e8;
    --card: #fffdf6;
    --ink: #191813;
    --muted: #656258;
    --line: #e9e3cf;
    --navy: #273fa0;
    --accent: #de5752;
    --link: #273fa0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12120f;
      --card: #1d1d19;
      --ink: #f7f3e6;
      --muted: #c7c3b5;
      --line: #3c3a31;
      --navy: #5369cf;
      --accent: #ff817a;
      --link: #aebaff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 560px;
    padding: 48px 40px 40px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
  }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
  .mark {
    width: 40px; height: 40px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: var(--navy); color: #fff;
    font-family: Georgia, "Times New Roman", serif; font-size: 23px; line-height: 1;
  }
  .word { font-family: Georgia, "Times New Roman", serif; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .word span { color: var(--accent); }
  h1 {
    margin: 0 0 16px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em;
  }
  p { margin: 0 0 16px; }
  .lead { font-size: 19px; }
  .contact { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); }
  a { color: var(--link); font-weight: 600; text-underline-offset: 3px; }
  footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
  @media (max-width: 480px) {
    main { padding: 36px 24px 28px; border-radius: 20px; }
    h1 { font-size: 34px; }
  }
</style>
</head>
<body>
<main>
  <div class="logo" role="img" aria-label="Progora">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="word" aria-hidden="true">Progor<span>a</span></div>
  </div>
  <h1>Lanseras snart</h1>
  <p class="lead">Progora är en ny marknadsplats där du hittar och bokar proffs till ditt event.</p>
  <p class="contact">Frågor? Skriv till oss på <a href="mailto:hej@progora.se">hej@progora.se</a>.</p>
  <footer>Progora AB · Stockholm</footer>
</main>
</body>
</html>
